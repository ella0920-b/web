
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY CALCULATOR</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #eef1f6;
            font-family: Arial, "Malgun Gothic", sans-serif;
            color: #202638;
        }

        .calculator {
            width: min(92vw, 360px);
            padding: 25px;
            border-radius: 24px;
            background: #ffffff;
            box-shadow: 0 16px 40px rgba(36, 48, 76, 0.13);
        }

        h1 {
            margin: 0 0 18px;
            font-size: 21px;
            text-align: center;
        }

        .screen {
            min-height: 112px;
            padding: 16px;
            margin-bottom: 16px;
            border-radius: 15px;
            background: #f4f6fa;
            text-align: right;
            overflow: hidden;
        }

        #expression {
            min-height: 25px;
            color: #7d879b;
            font-size: 15px;
            overflow-wrap: anywhere;
        }

        #result {
            margin-top: 10px;
            font-size: 32px;
            font-weight: 700;
            overflow-wrap: anywhere;
        }

        .keys {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 58px;
            border: 0;
            border-radius: 14px;
            background: #f0f2f7;
            color: #263047;
            font-size: 19px;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.97);
        }

        .utility {
            background: #e2e7f0;
        }

        .operator {
            background: #e5eaff;
            color: #4358bd;
        }

        .equals {
            background: #5268d8;
            color: white;
        }

        .history {
            margin-top: 18px;
            padding-top: 13px;
            border-top: 1px solid #e9ecf2;
            color: #737d91;
            font-size: 13px;
            line-height: 1.7;
        }

        #historyList {
            margin: 6px 0 0;
            padding-left: 18px;
        }
    </style>
</head>
<body>
    <main class="calculator">
        <h1>MY CALCULATOR</h1>

        <section class="screen">
            <div id="expression" aria-live="polite"></div>
            <div id="result" aria-live="polite">0</div>
        </section>

        <section class="keys">
            <button class="utility" data-action="clear">AC</button>
            <button class="utility" data-action="backspace">⌫</button>
            <button class="utility" data-value="(">(</button>
            <button class="utility" data-value=")">)</button>

            <button data-value="7">7</button>
            <button data-value="8">8</button>
            <button data-value="9">9</button>
            <button class="operator" data-value="/">÷</button>

            <button data-value="4">4</button>
            <button data-value="5">5</button>
            <button data-value="6">6</button>
            <button class="operator" data-value="*">×</button>

            <button data-value="1">1</button>
            <button data-value="2">2</button>
            <button data-value="3">3</button>
            <button class="operator" data-value="-">−</button>

            <button class="utility" data-value="%">%</button>
            <button data-value="0">0</button>
            <button data-value=".">.</button>
            <button class="operator" data-value="+">+</button>

            <button class="equals" data-action="calculate" style="grid-column: span 4;">=</button>
        </section>

        <section class="history">
            <strong>최근 계산</strong>
            <ol id="historyList"></ol>
        </section>
    </main>

    <script>
        const expressionView = document.getElementById("expression");
        const resultView = document.getElementById("result");
        const historyList = document.getElementById("historyList");

        let expression = "";
        let justCalculated = false;

        function tokenize(input) {
            const tokens = [];
            let i = 0;

            while (i < input.length) {
                const ch = input[i];

                if (ch === " ") {
                    i++;
                    continue;
                }

                if ((ch >= "0" && ch <= "9") || ch === ".") {
                    let number = "";
                    let dots = 0;

                    while (
                        i < input.length &&
                        ((input[i] >= "0" && input[i] <= "9") || input[i] === ".")
                    ) {
                        if (input[i] === ".") dots++;
                        if (dots > 1) {
                            throw new Error("숫자 형식을 확인해 주세요.");
                        }

                        number += input[i];
                        i++;
                    }

                    if (number === ".") {
                        throw new Error("숫자 형식을 확인해 주세요.");
                    }

                    tokens.push(Number(number));
                    continue;
                }

                if ("+-*/()%".includes(ch)) {
                    tokens.push(ch);
                    i++;
                    continue;
                }

                throw new Error("올바르지 않은 입력입니다.");
            }

            return tokens;
        }

        function calculate(input) {
            const tokens = tokenize(input);
            let position = 0;

            function parseExpression() {
                let value = parseTerm();

                while (
                    tokens[position] === "+" ||
                    tokens[position] === "-"
                ) {
                    const op = tokens[position++];
                    const right = parseTerm();

                    value = op === "+"
                        ? value + right
                        : value - right;
                }

                return value;
            }

            function parseTerm() {
                let value = parseUnary();

                while (
                    tokens[position] === "*" ||
                    tokens[position] === "/"
                ) {
                    const op = tokens[position++];
                    const right = parseUnary();

                    if (op === "/" && right === 0) {
                        throw new Error("0으로 나눌 수 없습니다.");
                    }

                    value = op === "*"
                        ? value * right
                        : value / right;
                }

                return value;
            }

            function parseUnary() {
                if (tokens[position] === "+") {
                    position++;
                    return parseUnary();
                }

                if (tokens[position] === "-") {
                    position++;
                    return -parseUnary();
                }

                let value = parsePrimary();

                while (tokens[position] === "%") {
                    position++;
                    value = value / 100;
                }

                return value;
            }

            function parsePrimary() {
                const token = tokens[position];

                if (token === "(") {
                    position++;
                    const value = parseExpression();

                    if (tokens[position] !== ")") {
                        throw new Error("괄호를 확인해 주세요.");
                    }

                    position++;
                    return value;
                }

                if (typeof token === "number") {
                    position++;
                    return token;
                }

                throw new Error("수식을 확인해 주세요.");
            }

            if (tokens.length === 0) {
                throw new Error("수식을 입력해 주세요.");
            }

            const answer = parseExpression();

            if (position !== tokens.length) {
                throw new Error("수식의 연산자나 괄호를 확인해 주세요.");
            }

            if (!Number.isFinite(answer)) {
                throw new Error("계산할 수 없는 결과입니다.");
            }

            return Number.parseFloat(answer.toPrecision(12)).toString();
        }

        function render() {
            expressionView.textContent = expression;
        }

        function addValue(value) {
            if (justCalculated && /[0-9.(]/.test(value)) {
                expression = "";
            }

            justCalculated = false;
            expression += value;
            resultView.textContent = expression || "0";
            render();
        }

        function clearAll() {
            expression = "";
            justCalculated = false;
            expressionView.textContent = "";
            resultView.textContent = "0";
        }

        function backspace() {
            expression = expression.slice(0, -1);
            justCalculated = false;
            resultView.textContent = expression || "0";
            render();
        }

        function calculateAndShow() {
            try {
                const answer = calculate(expression);
                const completed = expression + " = " + answer;

                expressionView.textContent = expression + " =";
                resultView.textContent = answer;

                const item = document.createElement("li");
                item.textContent = completed;
                historyList.prepend(item);

                while (historyList.children.length > 5) {
                    historyList.removeChild(historyList.lastChild);
                }

                expression = answer;
                justCalculated = true;
            } catch (error) {
                resultView.textContent = error.message;
                justCalculated = false;
            }
        }

        document.querySelector(".keys").addEventListener("click", function(event) {
            const button = event.target.closest("button");

            if (!button) return;

            if (button.dataset.action === "clear") {
                clearAll();
            } else if (button.dataset.action === "backspace") {
                backspace();
            } else if (button.dataset.action === "calculate") {
                calculateAndShow();
            } else if (button.dataset.value !== undefined) {
                addValue(button.dataset.value);
            }
        });

        document.addEventListener("keydown", function(event) {
            if (/^[0-9.+\-*/()%]$/.test(event.key)) {
                addValue(event.key);
            } else if (event.key === "Enter" || event.key === "=") {
                event.preventDefault();
                calculateAndShow();
            } else if (event.key === "Backspace") {
                backspace();
            } else if (event.key === "Escape") {
                clearAll();
            }
        });
    </script>
</body>
</html>
